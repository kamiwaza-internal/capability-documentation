name: Capability site
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Keep report submissions separate from site changes
        if: github.event_name == 'pull_request'
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-report-submission.mjs
      - name: Preserve published revision history
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/preserve-history.mjs
      - run: npm run test:integration
      - run: npm run build
      - name: Enforce every release download bundle
        run: npm run check:release-corpus
      - name: Stage approved public site only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CAPABILITY_SITE_PUBLISH_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CAPABILITY_SITE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/deployed-pages
      - name: Verify the deployed release bundles
        working-directory: site
        env:
          CAPABILITY_SITE_ACCESS_CLIENT_ID: ${{ secrets.CAPABILITY_SITE_ACCESS_CLIENT_ID }}
          CAPABILITY_SITE_ACCESS_CLIENT_SECRET: ${{ secrets.CAPABILITY_SITE_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p build
          tar -xf "$RUNNER_TEMP/deployed-pages/artifact.tar" -C build
          npm run check:release-corpus
          node scripts/check-deployed-downloads.mjs
